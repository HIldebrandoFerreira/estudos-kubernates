apiVersion: apps/v1
kind: Deployment
metadata:
  name: teste-app
spec:
  selector:
    matchLabels:
      app: teste-app
  template:
    metadata:
      labels:
        app: teste-app
    spec:
      containers:
      - name: teste-app
        image: rukasu/starwars-scene:v1
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: teste-svc
spec:
  selector:
    app: teste-app 
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30000
      protocol: TCP
