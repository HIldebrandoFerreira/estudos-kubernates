apiVersion: apps/v1
kind: Deployment
metadata:
  name: envhunter
spec:
  replicas: 3
  selector:
    matchLabels:
      app: envhunter
  template:
    metadata:
      labels:
        app: envhunter
    spec:
      containers:
      - name: envhunter
        image: rukasu/env-hunter:Xeon
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: envhunter-svc
spec:
  selector:
    app: envhunter
  type: NodePort
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30080

